[project]
name = "radiusstats-pipeline"
version = "0.1.0"
description = "Preprocessing pipeline for RadiusStats Europe: population and GDP on the EPSG:3035 1 km grid"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "rasterio>=1.4",
  "rio-cogeo>=5.3",
  "pyyaml>=6",
  "requests>=2.32",
  "scipy>=1.13",
  "shapely>=2.0",
  "pillow>=10.4",
  "pmtiles>=3.4",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "pyproj>=3.6"]

[project.scripts]
radiusstats-build = "radiusstats_pipeline.cli:main"
radiusstats-validate = "radiusstats_pipeline.validate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radiusstats_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# supply-chain hygiene: only resolve releases that are at least ~2 weeks old at lock time
exclude-newer = "2026-11-01T00:00:00Z"
