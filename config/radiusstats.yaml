# RadiusStats Europe — single source of truth for years, coverage and currencies.
# Roll forward by editing `population.latest` / `gdp.latest` and re-running the pipeline.

population:
  latest: 2025          # 1 January, most recent year available for ALL covered countries
  lags: [3, 5, 10]      # compared with latest-3, latest-5, latest-10

gdp:
  latest: 2023          # most recent year at regional level for ALL covered countries
  lags: [3, 5, 10]
  real_base_year: 2020  # price base and FIXED exchange-rate year for real (constant-price) GDP

low_confidence_gdp_radius_km: 25

# Countries the pipeline processes in this run. Full coverage list is `coverage`.
# Step 1 builds Belgium only; set to `all` for the full build.
build_countries: [BE]

coverage: [AT, BE, BG, HR, CY, CZ, DK, EE, FI, FR, DE, EL, HU, IE, IT, LV, LT, LU, MT, NL,
           PL, PT, RO, SK, SI, ES, SE, UK, CH, NO]

# NUTS 3 prefixes inside covered countries that are NOT mapped (too far from the map extent).
excluded_nuts_prefixes: [FRY]   # French outermost regions (Guadeloupe, Martinique, Guyane, Réunion, Mayotte)

# Euro area membership as of 2026-11-14 (Bulgaria joined 1 Jan 2026; verified at build time).
euro_area: [AT, BE, BG, HR, CY, EE, FI, FR, DE, EL, IE, IT, LV, LT, LU, MT, NL, PT, SK, SI, ES]
currencies:
  CZ: CZK
  DK: DKK
  HU: HUF
  PL: PLN
  RO: RON
  SE: SEK
  UK: GBP
  CH: CHF
  NO: NOK

country_names:
  AT: Austria
  BE: Belgium
  BG: Bulgaria
  HR: Croatia
  CY: Cyprus
  CZ: Czechia
  DK: Denmark
  EE: Estonia
  FI: Finland
  FR: France
  DE: Germany
  EL: Greece
  HU: Hungary
  IE: Ireland
  IT: Italy
  LV: Latvia
  LT: Lithuania
  LU: Luxembourg
  MT: Malta
  NL: Netherlands
  PL: Poland
  PT: Portugal
  RO: Romania
  SK: Slovakia
  SI: Slovenia
  ES: Spain
  SE: Sweden
  UK: United Kingdom
  CH: Switzerland
  NO: Norway

raster:
  cell_m: 1000
  levels: [1, 2, 4, 8, 16, 32]   # pyramid cell sizes in km; each level is a 2x2 sum of the previous
  pad_km: 64                      # padding around the built countries' bbox
  blocksize: 256
  nodata: -1.0

sources:
  gisco_grid: https://gisco-services.ec.europa.eu/grid/grid_1km.parquet
  census_grid: https://gisco-services.ec.europa.eu/census/2021/Eurostat_Census-GRID_2021_V3.zip
  census_grid_member: Eurostat_Census-GRID_2021_V3/ESTAT_Census_2021_V3.parquet
  census_country_member: Eurostat_Census-GRID_2021_V3/ESTAT_Census_2021_country.csv.zip
  eurostat_sdmx: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data
  ardeco_export: https://territorial.ec.europa.eu/ardeco-api-v2/rest/export

output:
  dir: data/build          # relative to the repository root
  base_url: ./             # URLs in manifest.json are relative to manifest.json
